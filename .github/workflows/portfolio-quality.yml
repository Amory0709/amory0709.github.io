name: Portfolio quality checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'README.md'
      - 'macintosh-portfolio/**'
      - '.github/workflows/portfolio-quality.yml'
  push:
    branches:
      - 'career-brand-portfolio-metadata-20261112'
    paths:
      - 'index.html'
      - 'README.md'
      - 'macintosh-portfolio/**'
      - '.github/workflows/portfolio-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Node test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run portfolio regression tests
        run: npm --prefix macintosh-portfolio test
