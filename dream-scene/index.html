<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌀 Aurora Nordica — Ori's Works</title>
<meta name="description" content="Aurora Nordica · Nordic dreamy 3D scene · Created by Ori with Three.js · 2026">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #020a10; font-family: 'Georgia', serif; }
  canvas { display: block; }
  #info {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    color: rgba(160, 255, 220, 0.5);
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    pointer-events: none;
    text-shadow: 0 0 15px rgba(80, 255, 200, 0.6);
  }
  #loading {
    position: fixed; inset: 0;
    background: #020a10;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    color: rgba(120, 220, 200, 0.7);
    font-size: 16px;
    letter-spacing: 2px;
    z-index: 100;
    transition: opacity 1.2s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 36px; height: 36px;
    border: 2px solid rgba(80, 200, 180, 0.15);
    border-top-color: rgba(100, 220, 200, 0.7);
    border-radius: 50%;
    animation: spin 1.2s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div>极光正在酝酿...</div>
</div>
<div id="info">✦ Aurora Nordica · 极光之境 · Drag to orbit · Scroll to zoom ✦</div>
<div id="signature">🌀 Created by Ori · 2026</div>
<style>
  #signature {
    position: fixed;
    bottom: 24px; right: 20px;
    color: rgba(80, 200, 160, 0.35);
    font-size: 11px;
    letter-spacing: 1px;
    pointer-events: none;
    font-family: 'Georgia', serif;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// === Scene ===
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x010810, 0.012);

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 600);
camera.position.set(0, 12, 35);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.minDistance = 15;
controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI * 0.82;

// === Sky gradient ===
const skyGeo = new THREE.SphereGeometry(250, 32, 32);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor: { value: new THREE.Color(0x000408) },
    midColor: { value: new THREE.Color(0x001a2a) },
    bottomColor: { value: new THREE.Color(0x010c18) }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 midColor;
    uniform vec3 bottomColor;
    varying vec3 vWorldPos;
    void main() {
      float h = normalize(vWorldPos).y;
      vec3 col;
      if (h > 0.3) col = mix(midColor, topColor, (h - 0.3) / 0.7);
      else col = mix(bottomColor, midColor, (h + 0.3) / 0.6);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// === Stars ===
const starBuf = new THREE.BufferGeometry();
const S = 3000;
const sPos = new Float32Array(S * 3);
const sSz = new Float32Array(S);
for (let i = 0; i < S; i++) {
  const t = Math.random() * Math.PI * 2;
  const p = Math.acos(2 * Math.random() - 1);
  const r = 200 + Math.random() * 40;
  sPos[i*3] = r * Math.sin(p) * Math.cos(t);
  sPos[i*3+1] = r * Math.sin(p) * Math.sin(t);
  sPos[i*3+2] = r * Math.cos(p);
  sSz[i] = Math.random() * 2.0 + 0.4;
}
starBuf.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
starBuf.setAttribute('size', new THREE.BufferAttribute(sSz, 1));
const starMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } },
  vertexShader: `
    attribute float size;
    uniform float time;
    varying float vA;
    void main() {
      vA = 0.4 + 0.6 * sin(time * 1.5 + position.x * 0.05 + position.y * 0.03);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (250.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vA;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      gl_FragColor = vec4(0.9, 0.95, 1.0, (1.0 - d * 2.0) * vA);
    }
  `,
  transparent: true, depthWrite: false
});
scene.add(new THREE.Points(starBuf, starMat));

// === Aurora curtain ===
const auroraCurtains = [];
function makeAurora(yOffset, colorA, colorB, speed, offset) {
  const pts = [];
  const N = 80;
  for (let i = 0; i <= N; i++) {
    const x = (i / N - 0.5) * 160;
    pts.push(x, yOffset, -60 + Math.sin(i * 0.3) * 3);
  }
  const curve = new THREE.CatmullRomCurve3(
    pts.reduce((acc, _, i) => {
      if (i % 3 === 0) acc.push(new THREE.Vector3(pts[i], pts[i+1], pts[i+2]));
      return acc;
    }, [])
  );

  const tube = new THREE.TubeGeometry(curve, 80, 0.4 + Math.random() * 0.6, 8, false);
  const mat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, colorA: { value: new THREE.Color(colorA) }, colorB: { value: new THREE.Color(colorB) } },
    vertexShader: `
      varying float vT;
      void main() {
        vT = uv.x;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float time;
      uniform vec3 colorA;
      uniform vec3 colorB;
      varying float vT;
      void main() {
        float wave = sin(vT * 12.0 + time * 1.5) * 0.5 + 0.5;
        float fade = sin(vT * 3.14159);
        vec3 col = mix(colorA, colorB, wave);
        gl_FragColor = vec4(col, fade * 0.35);
      }
    `,
    transparent: true, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending
  });
  const mesh = new THREE.Mesh(tube, mat);
  mesh.userData = { speed, offset, yOffset };
  scene.add(mesh);
  auroraCurtains.push(mesh);
}

makeAurora(30, 0x00ff88, 0x00aaff, 0.6, 0);
makeAurora(38, 0x00ffcc, 0x4400ff, 0.8, 1.2);
makeAurora(25, 0x00ffaa, 0xff00aa, 0.5, 2.4);

// Aurora glow plane
const glowGeo = new THREE.PlaneGeometry(180, 30);
const glowMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 }, color: { value: new THREE.Color(0x00cc88) } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float time;
    uniform vec3 color;
    varying vec2 vUv;
    void main() {
      float wave = sin(vUv.x * 8.0 + time) * 0.5 + 0.5;
      float fade = (1.0 - vUv.y) * wave * 0.25;
      gl_FragColor = vec4(color, fade);
    }
  `,
  transparent: true, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending
});
const glowMesh = new THREE.Mesh(glowGeo, glowMat);
glowMesh.position.set(0, 35, -55);
glowMesh.rotation.x = -0.2;
scene.add(glowMesh);

// === Frozen mountains ===
const mountains = [];
function makeMountain(x, z, baseW, h, color) {
  const pts = [];
  const seg = 12;
  for (let i = 0; i <= seg; i++) {
    const t = i / seg;
    const px = (t - 0.5) * baseW;
    let py = Math.sin(t * Math.PI) * h;
    py += Math.sin(t * Math.PI * 3) * h * 0.2;
    py += Math.sin(t * Math.PI * 7) * h * 0.05;
    if (i === 0 || i === seg) py = 0;
    pts.push(new THREE.Vector3(px, py, 0));
  }
  const shape = new THREE.Shape(pts);
  shape.lineTo(baseW / 2, -2);
  shape.lineTo(-baseW / 2, -2);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 8, bevelEnabled: false });
  const mat = new THREE.MeshStandardMaterial({
    color,
    roughness: 0.85,
    metalness: 0.1,
    emissive: new THREE.Color(color).multiplyScalar(0.05)
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, -8, z);
  mesh.rotation.y = Math.random() * 0.3;
  scene.add(mesh);
  mountains.push(mesh);
}

makeMountain(-35, -10, 40, 18, 0x0a1a2a);
makeMountain(-10, -25, 55, 25, 0x081525);
makeMountain(20, -20, 45, 20, 0x0a1f35);
makeMountain(45, -8, 35, 14, 0x081828);
makeMountain(-55, -30, 60, 30, 0x061020);

// === Ice lake / reflection ===
const lakeGeo = new THREE.CircleGeometry(18, 64);
const lakeMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: `
    uniform float time;
    varying vec2 vUv;
    void main() {
      vec2 c = vUv - 0.5;
      float d = length(c);
      float ripple = sin(d * 20.0 - time * 2.0) * 0.015;
      float alpha = (1.0 - smoothstep(0.35, 0.5, d)) * 0.5;
      alpha += ripple * alpha * 10.0;
      vec3 col = mix(vec3(0.0, 0.25, 0.3), vec3(0.0, 0.6, 0.7), d * 1.8);
      gl_FragColor = vec4(col, alpha * 0.7);
    }
  `,
  transparent: true, depthWrite: false, side: THREE.DoubleSide
});
const lake = new THREE.Mesh(lakeGeo, lakeMat);
lake.rotation.x = -Math.PI / 2;
lake.position.set(0, -7.8, 0);
scene.add(lake);

// === Snow particles ===
const snowN = 4000;
const snowBuf = new THREE.BufferGeometry();
const snowPos = new Float32Array(snowN * 3);
const snowSz = new Float32Array(snowN);
const snowPhase = new Float32Array(snowN);
for (let i = 0; i < snowN; i++) {
  snowPos[i*3] = (Math.random() - 0.5) * 120;
  snowPos[i*3+1] = Math.random() * 60 - 5;
  snowPos[i*3+2] = (Math.random() - 0.5) * 80;
  snowSz[i] = Math.random() * 3 + 1;
  snowPhase[i] = Math.random() * Math.PI * 2;
}
snowBuf.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
snowBuf.setAttribute('aSize', new THREE.BufferAttribute(snowSz, 1));
snowBuf.setAttribute('aPhase', new THREE.BufferAttribute(snowPhase, 1));
const snowMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } },
  vertexShader: `
    attribute float aSize;
    attribute float aPhase;
    uniform float time;
    void main() {
      vec3 pos = position;
      pos.y = mod(pos.y - time * (1.5 + aSize * 0.5) + 60.0, 65.0) - 5.0;
      pos.x += sin(time * 0.4 + aPhase) * 0.8;
      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      gl_PointSize = aSize * (200.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      gl_FragColor = vec4(0.85, 0.92, 1.0, (1.0 - d * 2.0) * 0.7);
    }
  `,
  transparent: true, depthWrite: false
});
scene.add(new THREE.Points(snowBuf, snowMat));

// === Ice crystals on lake ===
const crystals = [];
function makeCrystal(x, z, s, hue) {
  const h = 0.5 + Math.random() * 1.5;
  const geo = new THREE.OctahedronGeometry(s, 0);
  const mat = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color().setHSL(hue, 0.6, 0.7),
    emissive: new THREE.Color().setHSL(hue, 0.8, 0.3),
    emissiveIntensity: 0.6,
    transparent: true, opacity: 0.8,
    roughness: 0.05, metalness: 0.1,
    transmission: 0.5, thickness: 1.0, ior: 1.4
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, -7.2 + s * 0.5, z);
  mesh.rotation.y = Math.random() * Math.PI;
  mesh.userData = { phase: Math.random() * Math.PI * 2, speed: 0.3 + Math.random() * 0.3 };
  scene.add(mesh);
  crystals.push(mesh);
}

for (let i = 0; i < 20; i++) {
  const angle = Math.random() * Math.PI * 2;
  const r = 3 + Math.random() * 14;
  makeCrystal(Math.cos(angle) * r, Math.sin(angle) * r, 0.15 + Math.random() * 0.4, 0.5 + Math.random() * 0.2);
}

// === Frozen trees ===
function makeTree(x, z, scale) {
  const group = new THREE.Group();

  // Trunk
  const trunkGeo = new THREE.CylinderGeometry(0.08 * scale, 0.15 * scale, 2 * scale, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x1a2a3a, roughness: 0.9 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = scale;
  group.add(trunk);

  // Branches (3 tiers)
  const branchColors = [0x0a2030, 0x081828, 0x061525];
  for (let tier = 0; tier < 3; tier++) {
    const r = (3 - tier) * 0.4 * scale;
    const y = (1.8 + tier * 0.5) * scale;
    const bGeo = new THREE.ConeGeometry(r, 0.8 * scale, 6);
    const bMat = new THREE.MeshStandardMaterial({
      color: branchColors[tier],
      roughness: 0.8,
      emissive: new THREE.Color(branchColors[tier]).multiplyScalar(0.08)
    });
    const branch = new THREE.Mesh(bGeo, bMat);
    branch.position.y = y;
    group.add(branch);
  }

  group.position.set(x, -7.5, z);
  group.rotation.y = Math.random() * Math.PI * 2;
  scene.add(group);
}

const treePositions = [
  [-20, -5], [-18, 3], [-22, 1], [-15, -2],
  [15, -3], [18, 2], [14, 5], [20, -1],
  [-8, 8], [5, 10], [-12, 6],
  [30, -5], [25, 2], [-30, 3],
];
for (const [x, z] of treePositions) {
  makeTree(x, z, 0.8 + Math.random() * 1.2);
}

// === Northern lights pillars (volumetric) ===
for (let i = 0; i < 5; i++) {
  const px = (Math.random() - 0.5) * 80;
  const pz = -40 - Math.random() * 20;
  const pillarGeo = new THREE.CylinderGeometry(0.1, 0.5, 25 + Math.random() * 15, 6, 1, true);
  const pillarMat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, alpha: { value: 0.08 + Math.random() * 0.06 }, color: { value: new THREE.Color().setHSL(0.45 + Math.random() * 0.15, 0.9, 0.5) } },
    vertexShader: `varying float vH; void main() { vH = position.y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float time;
      uniform float alpha;
      uniform vec3 color;
      varying float vH;
      void main() {
        float fade = 1.0 - abs(vH) / 20.0;
        gl_FragColor = vec4(color, alpha * fade * fade);
      }
    `,
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending
  });
  const pillar = new THREE.Mesh(pillarGeo, pillarMat);
  pillar.position.set(px, 25, pz);
  pillar.userData = { phase: Math.random() * Math.PI * 2 };
  scene.add(pillar);
}

// === Lighting ===
const ambLight = new THREE.AmbientLight(0x050e1a, 1.2);
scene.add(ambLight);

const moonLight = new THREE.DirectionalLight(0x4488bb, 0.6);
moonLight.position.set(-30, 50, -30);
scene.add(moonLight);

const auroraLight = new THREE.PointLight(0x00ffaa, 2, 80);
auroraLight.position.set(0, 30, -40);
scene.add(auroraLight);

const iceLight = new THREE.PointLight(0x00aaff, 1, 40);
iceLight.position.set(0, -5, 0);
scene.add(iceLight);

// === Camera target ===
const camTarget = new THREE.Vector3(0, 5, 0);

// === Resize ===
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// === Animate ===
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();

  starMat.uniforms.time.value = t;
  lakeMat.uniforms.time.value = t;

  // Aurora curtains wave
  for (const m of auroraCurtains) {
    const ud = m.userData;
    m.material.uniforms.time.value = t * ud.speed + ud.offset;
    m.position.y = ud.yOffset + Math.sin(t * 0.3 + ud.offset) * 1.5;
  }

  // Aurora glow
  glowMat.uniforms.time.value = t;
  glowMesh.material.uniforms.color.value.setHSL(0.4 + Math.sin(t * 0.1) * 0.05, 0.8, 0.4);

  // Pillar lights flicker
  auroraLight.intensity = 1.5 + Math.sin(t * 0.8) * 0.5;
  auroraLight.color.setHSL(0.38 + Math.sin(t * 0.15) * 0.05, 0.9, 0.5);

  // Ice crystals shimmer
  for (const c of crystals) {
    const ud = c.userData;
    c.material.emissiveIntensity = 0.4 + Math.sin(t * ud.speed + ud.phase) * 0.3;
  }

  // Camera slow drift
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

animate();
setTimeout(() => document.getElementById('loading').classList.add('hidden'), 800);
</script>
</body>
</html>
