<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamy Scene — 梦幻空间</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0a0015; font-family: 'Georgia', serif; }
  canvas { display: block; }
  #info {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(200, 150, 255, 0.7);
    font-size: 14px;
    letter-spacing: 2px;
    pointer-events: none;
    text-shadow: 0 0 20px rgba(150, 50, 255, 0.8);
  }
  #loading {
    position: fixed; inset: 0;
    background: #0a0015;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    color: rgba(180, 120, 255, 0.8);
    font-size: 18px;
    z-index: 100;
    transition: opacity 1s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(150, 80, 255, 0.2);
    border-top-color: rgba(200, 120, 255, 0.8);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div>织梦中...</div>
</div>
<div id="info">✦ 梦幻空间 · 拖拽旋转 · 滚轮缩放 ✦</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// === Scene Setup ===
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0015, 0.018);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 8, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 10;
controls.maxDistance = 80;
controls.maxPolarAngle = Math.PI * 0.85;

// === Sky gradient background ===
const skyGeo = new THREE.SphereGeometry(200, 32, 32);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor: { value: new THREE.Color(0x0a0020) },
    bottomColor: { value: new THREE.Color(0x3d0a50) },
    offset: { value: 20 },
    exponent: { value: 0.6 }
  },
  vertexShader: `
    varying vec3 vWorldPosition;
    void main() {
      vec4 worldPosition = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPosition.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    uniform float offset;
    uniform float exponent;
    varying vec3 vWorldPosition;
    void main() {
      float h = normalize(vWorldPosition + offset).y;
      gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
    }
  `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// === Stars ===
const starGeo = new THREE.BufferGeometry();
const starCount = 2000;
const starPositions = new Float32Array(starCount * 3);
const starSizes = new Float32Array(starCount);
for (let i = 0; i < starCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 150 + Math.random() * 40;
  starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  starPositions[i * 3 + 2] = r * Math.cos(phi);
  starSizes[i] = Math.random() * 2.5 + 0.5;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

const starMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } },
  vertexShader: `
    attribute float size;
    uniform float time;
    varying float vAlpha;
    void main() {
      vAlpha = 0.5 + 0.5 * sin(time * 2.0 + position.x * 0.1);
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (300.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float alpha = (1.0 - d * 2.0) * vAlpha;
      gl_FragColor = vec4(1.0, 0.95, 1.0, alpha);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// === Floating Crystals ===
const crystals = [];
function makeCrystal(x, y, z, scale, color) {
  const geo = new THREE.OctahedronGeometry(1, 0);
  const mat = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(color),
    metalness: 0.1,
    roughness: 0.05,
    transmission: 0.85,
    thickness: 1.5,
    ior: 2.4,
    transparent: true,
    opacity: 0.85,
    emissive: new THREE.Color(color),
    emissiveIntensity: 0.4,
    envMapIntensity: 1.0
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.scale.setScalar(scale);
  mesh.userData = {
    baseY: y,
    phase: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.5,
    floatSpeed: 0.3 + Math.random() * 0.4,
    rotX: Math.random() * Math.PI,
    rotZ: Math.random() * Math.PI
  };
  scene.add(mesh);
  crystals.push(mesh);
}

const crystalColors = [0xaa44ff, 0xff44aa, 0x44aaff, 0xff8844, 0x44ffaa, 0xff44ff, 0x88ff44];
for (let i = 0; i < 25; i++) {
  const x = (Math.random() - 0.5) * 50;
  const y = Math.random() * 20 - 5;
  const z = (Math.random() - 0.5) * 40;
  const scale = 0.4 + Math.random() * 1.5;
  const color = crystalColors[Math.floor(Math.random() * crystalColors.length)];
  makeCrystal(x, y, z, scale, color);
}

// === Central Magic Orb ===
const orbGeo = new THREE.SphereGeometry(3, 64, 64);
const orbMat = new THREE.MeshPhysicalMaterial({
  color: 0x8822ff,
  metalness: 0.0,
  roughness: 0.0,
  transmission: 0.9,
  thickness: 3.0,
  ior: 1.5,
  transparent: true,
  emissive: 0x6600ff,
  emissiveIntensity: 2.0,
  envMapIntensity: 2.0
});
const orb = new THREE.Mesh(orbGeo, orbMat);
orb.position.set(0, 2, 0);
scene.add(orb);

// Glow ring around orb
const ringGeo = new THREE.TorusGeometry(4.5, 0.08, 16, 100);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xaa44ff, transparent: true, opacity: 0.6 });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.position.copy(orb.position);
ring.rotation.x = Math.PI / 2;
scene.add(ring);

const ring2Geo = new THREE.TorusGeometry(5.5, 0.05, 16, 100);
const ring2Mat = new THREE.MeshBasicMaterial({ color: 0xff44aa, transparent: true, opacity: 0.4 });
const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
ring2.position.copy(orb.position);
ring2.rotation.x = Math.PI / 3;
scene.add(ring2);

// Orb inner glow
const glowGeo = new THREE.SphereGeometry(4, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0x6600cc,
  transparent: true,
  opacity: 0.15,
  side: THREE.BackSide,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const glow = new THREE.Mesh(glowGeo, glowMat);
glow.position.copy(orb.position);
scene.add(glow);

// === Floating Islands ===
const islands = [];
function makeIsland(x, y, z, size) {
  const group = new THREE.Group();
  
  // Rock base
  const rockGeo = new THREE.DodecahedronGeometry(size, 1);
  const positions = rockGeo.attributes.position;
  for (let i = 0; i < positions.count; i++) {
    positions.setY(i, positions.getY(i) * 0.5);
    positions.setX(i, positions.getX(i) + (Math.random() - 0.5) * size * 0.3);
    positions.setZ(i, positions.getZ(i) + (Math.random() - 0.5) * size * 0.3);
  }
  rockGeo.computeVertexNormals();
  const rockMat = new THREE.MeshStandardMaterial({
    color: 0x2a1a3a,
    roughness: 0.8,
    metalness: 0.2
  });
  const rock = new THREE.Mesh(rockGeo, rockMat);
  group.add(rock);

  // Grass/flower top
  const topGeo = new THREE.SphereGeometry(size * 0.7, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2);
  const topMat = new THREE.MeshStandardMaterial({
    color: 0x3a2a5a,
    roughness: 0.6,
    emissive: 0x220033,
    emissiveIntensity: 0.3
  });
  const top = new THREE.Mesh(topGeo, topMat);
  top.position.y = size * 0.2;
  group.add(top);

  // Small crystal on island
  const crGeo = new THREE.OctahedronGeometry(size * 0.25, 0);
  const crMat = new THREE.MeshPhysicalMaterial({
    color: 0xff88cc,
    emissive: 0xff44aa,
    emissiveIntensity: 1.0,
    transparent: true,
    opacity: 0.9,
    transmission: 0.5,
    roughness: 0.1
  });
  const cr = new THREE.Mesh(crGeo, crMat);
  cr.position.y = size * 0.7;
  cr.rotation.y = Math.random() * Math.PI;
  group.add(cr);

  group.position.set(x, y, z);
  group.userData = {
    baseY: y,
    phase: Math.random() * Math.PI * 2,
    floatSpeed: 0.2 + Math.random() * 0.2,
    rotSpeed: (Math.random() - 0.5) * 0.1
  };
  scene.add(group);
  islands.push(group);
}

makeIsland(-12, -3, 5, 2.5);
makeIsland(14, -2, -8, 2.0);
makeIsland(5, -4, 12, 1.8);
makeIsland(-8, -1, -12, 3.0);
makeIsland(18, -3, 3, 1.5);

// === Aurora Effect ===
const auroraCount = 200;
const auroraPositions = new Float32Array(auroraCount * 3);
for (let i = 0; i < auroraCount; i++) {
  auroraPositions[i * 3] = (Math.random() - 0.5) * 100;
  auroraPositions[i * 3 + 1] = 20 + Math.random() * 40;
  auroraPositions[i * 3 + 2] = -30 - Math.random() * 50;
}
const auroraGeo = new THREE.BufferGeometry();
auroraGeo.setAttribute('position', new THREE.BufferAttribute(auroraPositions, 3));
const auroraMat = new THREE.PointsMaterial({
  color: 0x44ffaa,
  size: 0.5,
  transparent: true,
  opacity: 0.3,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const aurora = new THREE.Points(auroraGeo, auroraMat);
scene.add(aurora);

// === Magic particle system ===
const particleCount = 3000;
const particleGeo = new THREE.BufferGeometry();
const pPositions = new Float32Array(particleCount * 3);
const pColors = new Float32Array(particleCount * 3);
const pSizes = new Float32Array(particleCount);
const pPhases = new Float32Array(particleCount);
for (let i = 0; i < particleCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 5 + Math.random() * 20;
  pPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  pPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) + Math.random() * 10;
  pPositions[i * 3 + 2] = r * Math.cos(phi);
  
  const colorChoice = Math.random();
  if (colorChoice < 0.33) { pColors[i*3]=0.8; pColors[i*3+1]=0.3; pColors[i*3+2]=1.0; }
  else if (colorChoice < 0.66) { pColors[i*3]=1.0; pColors[i*3+1]=0.4; pColors[i*3+2]=0.7; }
  else { pColors[i*3]=0.4; pColors[i*3+1]=0.8; pColors[i*3+2]=1.0; }
  
  pSizes[i] = Math.random() * 3 + 1;
  pPhases[i] = Math.random() * Math.PI * 2;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));
particleGeo.setAttribute('aSize', new THREE.BufferAttribute(pSizes, 1));
particleGeo.setAttribute('aPhase', new THREE.BufferAttribute(pPhases, 1));

const particleMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } },
  vertexShader: `
    attribute float aSize;
    attribute float aPhase;
    attribute vec3 color;
    uniform float time;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vColor = color;
      float t = time * 0.5 + aPhase;
      vec3 pos = position;
      pos.y += sin(t) * 0.5;
      pos.x += cos(t * 0.7) * 0.3;
      vAlpha = 0.3 + 0.4 * sin(t * 2.0);
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      gl_PointSize = aSize * (200.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float alpha = (1.0 - d * 2.0) * vAlpha;
      gl_FragColor = vec4(vColor, alpha);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// === Lighting ===
const ambientLight = new THREE.AmbientLight(0x1a0033, 0.8);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0xaa44ff, 3, 50);
pointLight1.position.set(0, 5, 0);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0xff44aa, 2, 40);
pointLight2.position.set(-15, 10, -5);
scene.add(pointLight2);

const pointLight3 = new THREE.PointLight(0x44aaff, 1.5, 40);
pointLight3.position.set(15, 5, 10);
scene.add(pointLight3);

// === Resize ===
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// === Animate ===
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();
  
  // Stars twinkling
  starMat.uniforms.time.value = t;
  
  // Orb pulse
  const pulse = 1 + 0.08 * Math.sin(t * 2);
  orb.scale.setScalar(pulse);
  orbMat.emissiveIntensity = 1.5 + Math.sin(t * 3) * 0.5;
  
  // Rings rotation
  ring.rotation.z = t * 0.5;
  ring2.rotation.z = -t * 0.3;
  ring2.rotation.x = Math.PI / 3 + Math.sin(t * 0.5) * 0.2;
  
  // Glow pulse
  glow.scale.setScalar(1 + 0.15 * Math.sin(t * 2.5));
  glowMat.opacity = 0.1 + 0.08 * Math.sin(t * 2);
  
  // Point lights orbit
  pointLight1.position.x = Math.sin(t * 0.7) * 10;
  pointLight1.position.z = Math.cos(t * 0.7) * 10;
  pointLight2.position.x = Math.sin(t * 0.4 + 2) * 8;
  pointLight2.position.z = Math.cos(t * 0.4 + 2) * 8;
  
  // Crystal floating & rotation
  for (const c of crystals) {
    const ud = c.userData;
    c.position.y = ud.baseY + Math.sin(t * ud.floatSpeed + ud.phase) * 1.5;
    c.rotation.x += ud.rotSpeed * 0.016;
    c.rotation.z += ud.rotSpeed * 0.7 * 0.016;
  }
  
  // Island floating
  for (const island of islands) {
    const ud = island.userData;
    island.position.y = ud.baseY + Math.sin(t * ud.floatSpeed + ud.phase) * 0.8;
    island.rotation.y += ud.rotSpeed * 0.016;
  }
  
  // Particles
  particleMat.uniforms.time.value = t;
  
  // Aurora wave
  aurora.rotation.y = t * 0.05;
  const auroraPos = auroraGeo.attributes.position;
  for (let i = 0; i < auroraCount; i++) {
    const x = auroraPos.getX(i);
    const z = auroraPos.getZ(i);
    auroraPos.setY(i, 20 + Math.sin(t + x * 0.05 + z * 0.03) * 5 + Math.random() * 2);
  }
  auroraPos.needsUpdate = true;
  auroraMat.opacity = 0.2 + 0.1 * Math.sin(t);
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

animate();

// Hide loading
setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
}, 500);
</script>
</body>
</html>
