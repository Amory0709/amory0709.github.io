<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume PDF</title>
<style>
*{box-sizing:border-box}html,body{height:100%;min-height:0;overflow:hidden;background:#e8e8e6}
body{margin:0;font:14px/1.5 system-ui;display:flex;flex-direction:column}
#navigation{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 12px;background:#fafafa;border-bottom:1px solid #ccc}
#navigation[hidden]{display:none}button,select{font:inherit;min-height:36px;padding:4px 10px;background:white;border:1px solid #aaa;border-radius:3px;color:#111}button:disabled{opacity:.45}
#status{flex:none;margin:0;padding:6px 12px;color:#555;text-align:center}#status[hidden]{display:none}
#pages{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;scrollbar-gutter:stable;padding:16px;-webkit-overflow-scrolling:touch}
figure{position:relative;margin:0 auto 20px;max-width:900px;scroll-margin-top:16px}figcaption{padding:0 0 6px;text-align:center;color:#555}
canvas{display:block;width:100%;height:auto;background:white;box-shadow:0 2px 8px #0002}
.accessible-text{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.page-error{padding:24px;background:white;color:#8a2525}
:focus-visible{outline:2px solid #0033cc;outline-offset:2px}@media(max-width:480px){#pages{padding:8px}#navigation{gap:8px}}
</style></head>
<body>
<nav id="navigation" aria-label="PDF pages" hidden><button id="previousPage" type="button">Previous</button><select id="pageNumber" aria-label="Choose page"></select><button id="nextPage" type="button">Next</button></nav>
<p id="status" role="status">Loading PDF…</p><main id="pages" tabindex="0" aria-label="Resume pages"></main>
<script type="module" src="./resume-preview.mjs?v=2"></script></body></html>
